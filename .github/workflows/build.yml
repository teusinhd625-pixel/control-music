name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extrair o ZIP
        run: |
          if [ ! -d control-music ]; then
            unzip -o -q ./*.zip
          fi
          ls control-music

      - name: Montar projeto Capacitor
        run: bash control-music/build.sh

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Control-Music-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
